name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The live CMS unless the repository sets its own variables.
env:
  WORDPRESS_GRAPHQL_URL: ${{ vars.WORDPRESS_GRAPHQL_URL || 'https://cms.everydaydigital.co.nz/graphql' }}
  NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://everydaydigital.co.nz' }}

jobs:
  check:
    name: Audit, format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # The same checks as the pre-commit hook, without writing any files
      - run: pnpm run tidy:check
      - run: pnpm run build

  e2e:
    name: End-to-end smoke tests
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

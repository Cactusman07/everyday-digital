# Local headless WordPress for development. Credentials are local-only.

# Database connection shared by WordPress and WP-CLI. The &db-name and
# &db-password anchors are reused to set up the database itself.
x-db-env: &db-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: &db-name wordpress
  WORDPRESS_DB_USER: root
  WORDPRESS_DB_PASSWORD: &db-password password

# WordPress core, plus the theme and must-use plugins from this repo. The
# theme folder also contains mu-plugins/; WordPress ignores it there.
x-wp-volumes: &wp-volumes
  - ./wordpress:/var/www/html
  - ./wpTheme:/var/www/html/wp-content/themes/everyday-digital
  - ./wpTheme/mu-plugins:/var/www/html/wp-content/mu-plugins

services:
  wordpress:
    image: wordpress:7-php8.3-apache
    container_name: wordpress
    volumes: *wp-volumes
    environment:
      <<: *db-env
      WORDPRESS_TABLE_PREFIX: wp_
    depends_on:
      - db
    restart: always
    ports:
      - 8181:80

  db:
    image: mariadb:11
    container_name: db
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: *db-password
      MARIADB_DATABASE: *db-name
    restart: always
    ports:
      - 3306:3306

  phpmyadmin:
    image: phpmyadmin:5
    container_name: phpmyadmin
    depends_on:
      - db
    environment:
      PMA_HOST: db
    restart: always
    ports:
      - 8180:80

  wordpress-cli:
    image: wordpress:cli-2-php8.3
    container_name: wordpress-cli
    # Run as the wordpress container's www-data (uid/gid 33) so files WP-CLI
    # creates stay writable by the web server. The CLI image's own www-data
    # is uid 82, which Apache couldn't write to.
    user: "33:33"
    volumes: *wp-volumes
    environment: *db-env
    depends_on:
      - db
      - wordpress

volumes:
  db_data:
